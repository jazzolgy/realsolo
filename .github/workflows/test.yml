name: tests

on:
  push:
    branches:
      - main
      - research/legend-intelligence
      - player/piano
      - player/bass
      - player/drums
      - player/sax
      - transcribe
      - realtime/ensemble-app
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Architecture boundary guard
        run: pytest -q tests/architecture
      - name: Full test suite
        run: pytest -q
