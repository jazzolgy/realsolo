<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RealSolo Stage 1</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef2f7;background:#101217}
*{box-sizing:border-box}body{margin:0;background:#101217}button,select,input{font:inherit}.app{max-width:1180px;margin:0 auto;padding:20px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{margin:0;font-size:clamp(25px,4vw,38px);letter-spacing:-.03em}.sub{color:#9ba5b4;margin-top:5px;font-size:14px}
.controls{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.control{display:grid;gap:5px;color:#9ba5b4;font-size:12px}
.control input,.control select{min-height:42px;border:1px solid #303642;border-radius:10px;background:#181c23;color:#eef2f7;padding:0 10px}
.tempo{width:82px}.small{width:78px}button{min-height:42px;border:0;border-radius:11px;padding:0 16px;cursor:pointer}
#play{background:#eef2f7;color:#101217;font-weight:700;min-width:92px}#stop{background:#252b35;color:#eef2f7}
.status{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.status>div{background:#171b22;border:1px solid #282e38;border-radius:12px;padding:12px 14px;min-width:0}
.label{color:#8994a3;font-size:11px;text-transform:uppercase;letter-spacing:.08em}.value{font-size:20px;font-weight:650;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.bar{position:relative;min-height:118px;background:#171b22;border:1px solid #2a303a;border-radius:13px;padding:14px 12px 12px;transition:150ms ease;overflow:hidden}
.bar.active{border-color:#e7edf6;background:#202631;transform:translateY(-2px)}.bar .num{position:absolute;right:9px;top:8px;color:#687382;font-size:11px}
.mark{color:#9ba5b4;font-weight:700;font-size:11px;min-height:18px}.chords{height:64px;display:flex;align-items:center;justify-content:space-around;gap:8px}
.chord{font-size:clamp(20px,3vw,29px);font-weight:760;letter-spacing:-.02em}.beat-dots{display:flex;gap:5px}.beat-dot{width:6px;height:6px;border-radius:50%;background:#424b59}.beat-dot.on{background:#f4f7fb}
.footer{margin-top:14px;color:#778392;font-size:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media(max-width:760px){.app{padding:14px}.chart{grid-template-columns:repeat(2,minmax(0,1fr))}.status{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:420px){.chart{grid-template-columns:1fr}.controls{width:100%}.control{flex:1 1 90px}.control input,.control select{width:100%}#play,#stop{flex:1}}
</style>
</head>
<body>
<main class="app">
<header class="top">
<div><h1 id="title">RealSolo</h1><div class="sub">Stage 1 · chart + playback transport</div></div>
<div class="controls">
<label class="control">Your role<select id="role"><option value="soloist">Soloist — AI accompanies</option><option value="comper">Comper — AI solos</option></select></label>
<label class="control">Tempo<input id="tempo" class="tempo" type="number" min="40" max="320" value="120"></label>
<label class="control">Transpose<select id="transpose" class="small"></select></label>
<label class="control">Choruses<input id="choruses" class="small" type="number" min="1" max="20" value="3"></label>
<label class="control">Sound
<select id="soundMode">
<option value="sampler">SoundFont sampler</option>
<option value="oscillator">Oscillator fallback</option>
</select></label>
<label class="control">SoundFont
<input id="soundfont" type="file" accept=".sf2,.sf3,.sfogg,.dls">
</label>
<button id="play" type="button">Play</button><button id="stop" type="button">Stop</button>
</div></header>
<section class="status" aria-live="polite">
<div><div class="label">AI role</div><div class="value" id="aiRole">Accompaniment</div></div>
<div><div class="label">Position</div><div class="value" id="position">Bar 1 · Beat 1</div></div>
<div><div class="label">Chord</div><div class="value" id="currentChord">—</div></div>
<div><div class="label">Chorus</div><div class="value" id="chorus">1 / 3</div></div>
</section>
<section class="chart" id="chart" aria-label="Chord chart"></section>
<div class="footer"><span>Chart transport is the Stage-1 clock. Microphone interaction is added in Stage 2.</span><span id="stateText">Stopped</span></div>
<div class="footer"><span id="audioText">Audio engine: oscillator fallback</span><span id="bankText">Load an SF2/SF3/DLS bank for sample playback</span></div>
<script type="module" src="/soundfont_engine.js"></script>
</main>
<script>
(function(){
var els={
title:document.querySelector("#title"),chart:document.querySelector("#chart"),role:document.querySelector("#role"),tempo:document.querySelector("#tempo"),
transpose:document.querySelector("#transpose"),choruses:document.querySelector("#choruses"),play:document.querySelector("#play"),stop:document.querySelector("#stop"),
aiRole:document.querySelector("#aiRole"),position:document.querySelector("#position"),currentChord:document.querySelector("#currentChord"),chorus:document.querySelector("#chorus"),stateText:document.querySelector("#stateText"),audioText:document.querySelector("#audioText"),
soundMode:document.querySelector("#soundMode"),soundfont:document.querySelector("#soundfont"),bankText:document.querySelector("#bankText")
};
var audioCtx=null,master=null,sampler=null,lastScheduledBeat=-1,soloStep=0;
for(var i=-12;i<=12;i++){var opt=document.createElement("option");opt.value=String(i);opt.textContent=i===0?"0":(i>0?"+"+i:String(i));els.transpose.appendChild(opt);}
var chart=null,playing=false,startedAt=0,offsetBeats=0,raf=0;
function clamp(n,a,b){return Math.max(a,Math.min(b,n));}
function ensureAudio(){
if(!audioCtx){audioCtx=new (window.AudioContext||window.webkitAudioContext)();master=audioCtx.createGain();master.gain.value=.22;master.connect(audioCtx.destination);}
if(audioCtx.state==="suspended")audioCtx.resume();
els.audioText.textContent=sampler&&sampler.ready?"Audio engine: SoundFont sampler":"Audio engine: oscillator fallback";
}
async function loadSoundFont(file){
ensureAudio();
if(!window.RealSoloSoundFontEngine)throw new Error("SoundFont module is still loading.");
if(!sampler)sampler=new window.RealSoloSoundFontEngine(audioCtx);
els.bankText.textContent="Loading "+file.name+"…";
var buf=await file.arrayBuffer();
await sampler.load(buf,file.name);
els.soundMode.value="sampler";
els.audioText.textContent="Audio engine: SoundFont sampler";
els.bankText.textContent=file.name+" · sample playback ready";
}
function sampleReady(){return els.soundMode.value==="sampler"&&sampler&&sampler.ready;}

function midiHz(n){return 440*Math.pow(2,(n-69)/12);}
function tone(midi,when,dur,type,gain){
if(!audioCtx)return;var osc=audioCtx.createOscillator(),g=audioCtx.createGain();osc.type=type||"sine";osc.frequency.value=midiHz(midi);
g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(gain||.08,when+.008);g.gain.exponentialRampToValueAtTime(.0001,when+dur);
osc.connect(g);g.connect(master);osc.start(when);osc.stop(when+dur+.03);
}
function noiseHit(when,dur,gain){
if(!audioCtx)return;var len=Math.max(32,Math.floor(audioCtx.sampleRate*dur)),buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate),data=buf.getChannelData(0);
for(var i=0;i<len;i++)data[i]=Math.random()*2-1;var src=audioCtx.createBufferSource(),g=audioCtx.createGain();src.buffer=buf;g.gain.setValueAtTime(gain||.035,when);g.gain.exponentialRampToValueAtTime(.0001,when+dur);src.connect(g);g.connect(master);src.start(when);
}
async function playAccompaniment(chord,beatIndex,when,beatDur){
try{var r=await fetch("/api/accompaniment?chord="+encodeURIComponent(chord)+"&beat="+beatIndex);var frame=await r.json();
frame.bass.forEach(function(n){if(sampleReady())sampler.bass(n,92,when,beatDur*.82);else tone(n,when,beatDur*.82,"sine",.09);});
frame.comp.forEach(function(n){if(sampleReady())sampler.piano(n,68,when+.025,beatDur*.58);else tone(n,when+.025,beatDur*.58,"triangle",.035);});
if(frame.drums.ride){if(sampleReady())sampler.drum(51,58,when,.11);else noiseHit(when,Math.min(.08,beatDur*.18),.018);}
if(frame.drums.hat){if(sampleReady())sampler.drum(42,70,when+.01,.06);else noiseHit(when+.01,Math.min(.04,beatDur*.1),.03);}
if(frame.drums.kick){if(sampleReady())sampler.drum(36,76,when,.1);else tone(36,when,.11,"sine",.055);}
}catch(e){els.audioText.textContent="Audio error: "+e.message;}
}
async function playSolo(chord,nextChord,beatInBar,when,beatDur){
try{
var rhythmReq=fetch("/api/accompaniment?chord="+encodeURIComponent(chord)+"&beat="+Math.floor(beatInBar));
var url="/api/solo-event?chord="+encodeURIComponent(chord)+"&next_chord="+encodeURIComponent(nextChord)+"&beat_in_bar="+beatInBar+"&phrase_step="+soloStep++;
var soloReq=fetch(url);var both=await Promise.all([rhythmReq,soloReq]);var frame=await both[0].json();var ev=await both[1].json();
frame.bass.forEach(function(n){if(sampleReady())sampler.bass(n,88,when,beatDur*.82);else tone(n,when,beatDur*.82,"sine",.075);});
if(frame.drums.ride){if(sampleReady())sampler.drum(51,56,when,.11);else noiseHit(when,Math.min(.08,beatDur*.18),.016);}
if(frame.drums.hat){if(sampleReady())sampler.drum(42,66,when+.01,.06);else noiseHit(when+.01,Math.min(.04,beatDur*.1),.025);}
if(frame.drums.kick){if(sampleReady())sampler.drum(36,72,when,.1);else tone(36,when,.11,"sine",.045);}
if(ev.pitch!==null){var dur=Math.max(.08,ev.duration_beats*beatDur);if(sampleReady())sampler.solo(ev.pitch,82,when,dur);else tone(ev.pitch,when,dur,"sawtooth",.045);}
}catch(e){els.audioText.textContent="Solo error: "+e.message;}
}
function nextChordAt(barIndex,beatInBar){
var chords=chart.bars[barIndex].chords;if(chords.length>1&&beatInBar<chart.beats_per_bar/2)return chords[1];
var next=(barIndex+1)%chart.bars.length;return chart.bars[next].chords[0]||"";
}
function scheduleSound(nowMs){
if(!playing||!audioCtx||!chart)return;var tempo=clamp(Number(els.tempo.value)||120,40,320),beatDur=60/tempo,beatNow=currentBeat(nowMs),target=Math.floor(beatNow)+1;
while(lastScheduledBeat<target){
lastScheduledBeat++;if(lastScheduledBeat<Math.floor(beatNow))continue;
var beatsPerChorus=chart.bars.length*chart.beats_per_bar,inChorus=lastScheduledBeat%beatsPerChorus,barIndex=Math.floor(inChorus/chart.beats_per_bar),beatInBar=inChorus%chart.beats_per_bar;
var chord=chordAt(barIndex,beatInBar),when=audioCtx.currentTime+Math.max(.025,(lastScheduledBeat-beatNow)*beatDur);
if(els.role.value==="comper")playSolo(chord,nextChordAt(barIndex,beatInBar),beatInBar,when,beatDur);else playAccompaniment(chord,Math.floor(beatInBar),when,beatDur);
}
}
async function loadChart(){
var tr=Number(els.transpose.value||0);var res=await fetch("/api/chart?transpose="+encodeURIComponent(tr));chart=await res.json();els.title.textContent=chart.title;
if(!playing)els.tempo.value=Math.round(chart.tempo_bpm);renderChart();render(0);
}
function renderChart(){
els.chart.textContent="";
chart.bars.forEach(function(bar,i){
var node=document.createElement("article");node.className="bar";node.dataset.bar=String(i);
var mark=bar.rehearsal_mark?bar.rehearsal_mark:(bar.section||"");
var chordHtml=bar.chords.map(function(c){return '<span class="chord">'+c+"</span>";}).join("");
var dots="";for(var j=0;j<chart.beats_per_bar;j++)dots+='<i class="beat-dot"></i>';
node.innerHTML='<div class="mark">'+mark+'</div><div class="num">'+(i+1)+'</div><div class="chords">'+chordHtml+'</div><div class="beat-dots">'+dots+"</div>";
els.chart.appendChild(node);
});
}
function currentBeat(now){var tempo=clamp(Number(els.tempo.value)||120,40,320);if(!playing)return offsetBeats;return offsetBeats+((now-startedAt)/1000)*(tempo/60);}
function chordAt(barIndex,beatInBar){var chords=chart.bars[barIndex].chords;if(!chords.length)return "";var idx=Math.min(chords.length-1,Math.floor((beatInBar/chart.beats_per_bar)*chords.length));return chords[idx];}
function render(now){
if(!chart)return;var beats=currentBeat(now);var beatsPerChorus=chart.bars.length*chart.beats_per_bar;var totalChoruses=clamp(Number(els.choruses.value)||1,1,20);var totalBeats=beatsPerChorus*totalChoruses;
var displayBeats=Math.min(beats,Math.max(0,totalBeats-.0001));var chorus=Math.floor(displayBeats/beatsPerChorus);var inChorus=displayBeats%beatsPerChorus;var barIndex=Math.floor(inChorus/chart.beats_per_bar);
var beatInBar=inChorus%chart.beats_per_bar;var beatNumber=Math.floor(beatInBar)+1;var chord=chordAt(barIndex,beatInBar);
document.querySelectorAll(".bar").forEach(function(node,i){node.classList.toggle("active",i===barIndex);node.querySelectorAll(".beat-dot").forEach(function(dot,j){dot.classList.toggle("on",i===barIndex&&j===beatNumber-1);});});
els.position.textContent="Bar "+(barIndex+1)+" · Beat "+beatNumber;els.currentChord.textContent=chord||"—";els.chorus.textContent=(chorus+1)+" / "+totalChoruses;els.aiRole.textContent=els.role.value==="comper"?"Soloist":"Accompaniment";
if(playing&&beats>=totalBeats){playing=false;offsetBeats=0;els.play.textContent="Play";els.stateText.textContent="Finished";}
scheduleSound(now);if(playing)raf=requestAnimationFrame(render);
}
els.play.addEventListener("click",function(){
if(!chart)return;if(playing){offsetBeats=currentBeat(performance.now());playing=false;cancelAnimationFrame(raf);els.play.textContent="Resume";els.stateText.textContent="Paused";}
else{ensureAudio();startedAt=performance.now();lastScheduledBeat=Math.floor(offsetBeats)-1;playing=true;els.play.textContent="Pause";els.stateText.textContent=els.role.value==="comper"?"Playing · AI soloist":"Playing · AI accompaniment";raf=requestAnimationFrame(render);}
});
els.stop.addEventListener("click",function(){playing=false;cancelAnimationFrame(raf);offsetBeats=0;lastScheduledBeat=-1;soloStep=0;if(sampler&&sampler.ready)sampler.panic();fetch("/api/reset-solo");els.play.textContent="Play";els.stateText.textContent="Stopped";render(0);});
els.role.addEventListener("change",function(){render(performance.now());});els.choruses.addEventListener("change",function(){render(performance.now());});
els.transpose.addEventListener("change",loadChart);
els.soundfont.addEventListener("change",function(){var f=els.soundfont.files&&els.soundfont.files[0];if(f)loadSoundFont(f).catch(function(err){els.bankText.textContent="SoundFont error: "+err.message;els.soundMode.value="oscillator";});});
els.soundMode.addEventListener("change",function(){if(els.soundMode.value==="sampler"&&!sampleReady()){els.bankText.textContent="Choose an SF2/SF3/DLS file first.";els.soundMode.value="oscillator";}});
els.tempo.addEventListener("change",function(){els.tempo.value=String(clamp(Number(els.tempo.value)||120,40,320));});
loadChart().catch(function(err){els.stateText.textContent="Chart load error: "+err.message;});
})();
</script>
</body>
</html>
