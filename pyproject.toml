[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realsolo-music-intelligence"
version = "1.32.0"
description = "RealSolo Music Intelligence Platform"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "numpy>=1.26,<3"]
midi = ["mido>=1.3,<2", "python-rtmidi>=1.5,<2"]
audio = ["numpy>=1.26,<3", "sounddevice>=0.5,<1"]
research-ml = ["numpy>=1.26,<3", "tensorflow>=2.16", "tensorflow-hub>=0.16"]
live = [
  "numpy>=1.26,<3",
  "sounddevice>=0.5,<1",
  "mido>=1.3,<2",
  "python-rtmidi>=1.5,<2",
]

[project.scripts]
realsolo-ensemble = "realtime.ensemble_app.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["music_intelligence*", "realtime*", "players*"]
