[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realsolo-music-intelligence"
version = "1.30.0"
description = "RealSolo Music Intelligence Platform"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]
study = ["numpy>=1.26,<3"]

[project.scripts]
realsolo-study = "music_intelligence.study.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["music_intelligence*", "players*"]
