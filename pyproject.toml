[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realsolo-music-intelligence"
version = "1.31.0"
description = "RealSolo Music Intelligence Platform"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]
midi = ["mido>=1.3,<2", "python-rtmidi>=1.5,<2"]

[project.scripts]
realsolo-ensemble = "realtime.ensemble_app.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["music_intelligence*", "realtime*"]
